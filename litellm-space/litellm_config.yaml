router_settings:
  routing_strategy: "usage-based-routing-v2"
  num_retries: 5
  timeout: 120
  retry_after: 3
  allowed_fails: 3
  cooldown_time: 30
  enable_pre_call_checks: true

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  store_model_in_db: false

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 120
  num_retries: 3
  cache: false
  fallbacks:
    - default: ["fast", "smart"]
    - fast: ["default", "gemini-flash"]
    - smart: ["default", "gemini-flash"]
    - trinity: ["gemma-27b", "gemini-flash"]
    - gemma-27b: ["trinity", "gemini-flash"]
    - llama-70b: ["trinity", "gemini-flash"]
    - qwen-235b: ["llama-70b", "trinity"]
    - groq-llama: ["llama-70b", "trinity"]
