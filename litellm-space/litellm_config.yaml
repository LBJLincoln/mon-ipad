# LiteLLM Proxy — Nomos Multi-RAG Key Pooling & Model Routing
# Deployed on HF Space: LBJLincoln/nomos-rag-engine-7
# Updated: 2026-03-04
#
# Architecture:
#   - 7 OpenRouter keys (round-robin + fallback on 429)
#   - 1 Google Gemini key (fallback)
#   - 5 Groq keys (fallback, may be dead/403)
#   - Model aliases: "fast", "smart", "default"
#
# ENV VARS required (set as HF Space secrets):
#   OPENROUTER_API_KEY, OPENROUTER_KEY_STANDARD, OPENROUTER_KEY_GRAPH,
#   OPENROUTER_KEY_QUANTITATIVE, OPENROUTER_KEY_ORCHESTRATOR,
#   OPENROUTER_KEY_PME, OPENROUTER_KEY_SPARE
#   GOOGLE_API_KEY
#   GROQ_API_KEY, GROQ_API_KEY_2, GROQ_API_KEY_3, GROQ_API_KEY_4, GROQ_API_KEY_5
#   LITELLM_MASTER_KEY

model_list:
