  # ALIAS: "default" — Auto-rotate across all providers
  # Primary: Trinity (most reliable free model on OpenRouter)
  # Fallback: Gemini, then Groq
  # =====================================================================

  # --- OpenRouter Trinity x7 keys ---
  - model_name: "default"
    litellm_params:
      model: "openrouter/arcee-ai/trinity-large-preview:free"
