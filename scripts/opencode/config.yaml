# OpenCode Department Council Configuration
# Used by wrapper scripts to configure per-department behavior
# OpenCode itself uses .opencode.json (auto-generated by wrapper scripts)

# Global settings
opencode_binary: /home/lahargnedebartoli/.local/bin/opencode
repo_root: /home/lahargnedebartoli/mon-ipad
data_dir: /home/lahargnedebartoli/mon-ipad/data/opencode
env_file: /home/lahargnedebartoli/mon-ipad/.env.local
max_tokens: 4000
timeout_seconds: 300  # 5 min per Karpathy loop rule

# Provider priority (first available key wins)
# OpenCode reads these from environment variables:
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY
provider_priority:
  - anthropic    # Claude (best for code analysis)
  - openrouter   # Multi-model fallback
  - openai       # GPT-4 fallback
  - gemini       # Gemini fallback

# Department-specific configurations
departments:
  research:
    description: "Scan arXiv/papers for NBA prediction techniques"
    model: "claude-sonnet-4"
    max_tokens: 4000
    output_file: "research-latest.json"
    schedule: "0 */6 * * *"  # Every 6 hours
    prompt_template: |
      You are the Research Department AI for Nomos42 NBA Quant.
      Scan for the latest NBA prediction research, machine learning techniques
      applicable to sports prediction, and calibration improvements.
      Focus on: Brier score optimization, feature engineering, ensemble methods,
      calibration techniques, and any NBA-specific prediction advances.
      Current best Brier: 0.21570. Target: < 0.20.

  evaluation:
    description: "Audit prediction quality and calibration"
    model: "claude-sonnet-4"
    max_tokens: 4000
    output_file: "evaluation-latest.json"
    schedule: "30 */6 * * *"  # Every 6 hours, offset 30min
    prompt_template: |
      You are the Evaluation Department AI for Nomos42 NBA Quant.
      Audit prediction quality: check calibration curves, identify systematic biases,
      flag overconfident predictions, and compare model performance across game types.
      Look for: home/away bias, rest day effects, back-to-back penalties,
      and any prediction drift over time.

  infra:
    description: "Check infrastructure health across all systems"
    model: "claude-sonnet-4"
    max_tokens: 4000
    output_file: "infra-latest.json"
    schedule: "15 */4 * * *"  # Every 4 hours, offset 15min
    prompt_template: |
      You are the Infrastructure Department AI for Nomos42 NBA Quant.
      Check system health: HF Spaces status (6 islands), VM resources,
      cron job execution, data freshness, and any service degradation.
      Report: disk usage, memory pressure, failed jobs, stale data,
      and recommended actions.
