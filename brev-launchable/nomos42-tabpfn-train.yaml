apiVersion: brev.dev/v1
kind: Launchable
metadata:
  name: nomos42-tabpfn-train
  description: TabPFN-2.5 walk-forward on 186-feature NBA (target Brier 0.21514)

spec:
  instanceType: h100.xlarge    # 1x H100 80GB — needed for TabPFN-2.5 full context
  image: nvcr.io/nvidia/pytorch:24.10-py3
  storage:
    size: 50Gi
  workdir: /workspace

  env:
    - name: WORKDIR
      value: /workspace/mon-ipad
    - name: N_ESTIMATORS
      value: "129"             # iteration 129 beat prior best (Brier 0.21514)

  secrets:
    - name: HF_TOKEN_3
    - name: GITHUB_TOKEN
    - name: NGC_API_KEY        # gets access to NVIDIA's TabPFN NIM (if available)

  setup: |
    git clone https://oauth2:${GITHUB_TOKEN}@github.com/LBJLincoln/mon-ipad.git /workspace/mon-ipad
    cd /workspace/mon-ipad
    pip install --quiet tabpfn pandas scikit-learn huggingface_hub

  launch: |
    cd /workspace/mon-ipad
    python scripts/colab/train_tabicl.py \
      --n-estimators ${N_ESTIMATORS:-129} \
      --walk-forward \
      --push-results
