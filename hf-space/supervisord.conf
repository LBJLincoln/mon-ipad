[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --maxmemory 192mb --maxmemory-policy allkeys-lru --appendonly no --save "" --port 6379
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:n8n-main]
command=n8n start
autostart=true
autorestart=true
priority=20
startsecs=10
environment=NODE_OPTIONS="--max-old-space-size=2048"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:n8n-worker-1]
command=n8n worker --concurrency=3
autostart=true
autorestart=true
priority=30
startsecs=30
environment=NODE_OPTIONS="--max-old-space-size=1536"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:n8n-worker-2]
command=n8n worker --concurrency=3
autostart=true
autorestart=true
priority=30
startsecs=30
environment=NODE_OPTIONS="--max-old-space-size=1536"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:n8n-worker-3]
command=n8n worker --concurrency=3
autostart=true
autorestart=true
priority=30
startsecs=30
environment=NODE_OPTIONS="--max-old-space-size=1536"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
