# LiteLLM Proxy — Key Pooling for Multi-RAG
# Pools 7 OpenRouter keys + Groq across all n8n Spaces
# Deployed on HF Space: LBJLincoln/nomos-rag-engine-7

model_list:
  # === Llama 70B (primary RAG model) — via OpenRouter ===
  - model_name: "llama-70b"
    litellm_params:
      model: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
      api_key: "os.environ/OPENROUTER_KEY_1"
      api_base: "https://openrouter.ai/api/v1"
      rpm: 20
      timeout: 120

  - model_name: "llama-70b"
    litellm_params:
      model: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
      api_key: "os.environ/OPENROUTER_KEY_2"
      api_base: "https://openrouter.ai/api/v1"
      rpm: 20
      timeout: 120

  - model_name: "llama-70b"
    litellm_params:
      model: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
      api_key: "os.environ/OPENROUTER_KEY_3"
      api_base: "https://openrouter.ai/api/v1"
      rpm: 20
      timeout: 120

  - model_name: "llama-70b"
    litellm_params:
      model: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
      api_key: "os.environ/OPENROUTER_KEY_4"
      api_base: "https://openrouter.ai/api/v1"
      rpm: 20
      timeout: 120

  - model_name: "llama-70b"
    litellm_params:
      model: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
      api_key: "os.environ/OPENROUTER_KEY_5"
      api_base: "https://openrouter.ai/api/v1"
      rpm: 20
      timeout: 120

  - model_name: "llama-70b"
    litellm_params:
      model: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
      api_key: "os.environ/OPENROUTER_KEY_6"
      api_base: "https://openrouter.ai/api/v1"
      rpm: 20
      timeout: 120

  - model_name: "llama-70b"
    litellm_params:
      model: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
      api_key: "os.environ/OPENROUTER_KEY_7"
      api_base: "https://openrouter.ai/api/v1"
      rpm: 20
      timeout: 120

  # === Gemma 27B (fast/lite model) — via OpenRouter ===
  - model_name: "gemma-27b"
    litellm_params:
      model: "openrouter/google/gemma-3-27b-it:free"
      api_key: "os.environ/OPENROUTER_KEY_1"
      api_base: "https://openrouter.ai/api/v1"
      rpm: 20
      timeout: 90

  - model_name: "gemma-27b"
    litellm_params:
      model: "openrouter/google/gemma-3-27b-it:free"
      api_key: "os.environ/OPENROUTER_KEY_2"
      api_base: "https://openrouter.ai/api/v1"
      rpm: 20
      timeout: 90

  - model_name: "gemma-27b"
    litellm_params:
      model: "openrouter/google/gemma-3-27b-it:free"
      api_key: "os.environ/OPENROUTER_KEY_3"
