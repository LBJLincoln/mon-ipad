server {
    listen 7860;

    # Increase buffer sizes for large webhook payloads
    client_max_body_size 50m;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Health check for HF Spaces
    location /healthz {
        proxy_pass http://127.0.0.1:5678/healthz;
        proxy_set_header Host $host;
    }

    # n8n webhooks (critical path for evals)
    location /webhook/ {
        proxy_pass http://127.0.0.1:5678/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }

    # n8n webhook-test (for testing mode)
    location /webhook-test/ {
        proxy_pass http://127.0.0.1:5678/webhook-test/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # n8n REST API
    location /rest/ {
        proxy_pass http://127.0.0.1:5678/rest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # n8n Public API
    location /api/ {
        proxy_pass http://127.0.0.1:5678/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # n8n MCP server endpoint
    location /mcp-server/ {
        proxy_pass http://127.0.0.1:5678/mcp-server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # n8n UI (for debugging — accessible via HF Space URL)
    location / {
        proxy_pass http://127.0.0.1:5678/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
