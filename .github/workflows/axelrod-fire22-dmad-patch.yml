name: "axelrod-fire22 — DMAD CONSENSUS_AGREE_JUSTIFIED"
on:
  push:
    paths:
      - '.github/workflows/axelrod-fire22-dmad-patch.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply DMAD patch + update work-queue
        run: python3 scripts/ops/axelrod-fire21-patch.py

      - name: Commit app.py + work-queue.json
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude Cloud Trigger"
          git add scripts/arena/hf-llm-trading-floor/app.py \
                  scripts/arena/hf-political-trading-floor/app.py \
                  data/work-queue.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Already patched — skipping patch commit"
          else
            git commit -m "feat(tf): Axelrod Mech A — DMAD CONSENSUS_AGREE_JUSTIFIED (NBA+POL, fire-22)

Spec gap (Mech A point 4): agents must justify why bet differs from
consensus OR why they agree. Added CONSENSUS_AGREE_JUSTIFIED [peer]
(reason=<structural>) as third DMAD option. Blind agreement flags lockstep
and triggers Mech B. NBA + POL parity. py_compile PASS both apps.
do_not_push_hf_space_yet: true

Co-Authored-By: Claude Cloud Trigger <noreply@anthropic.com>"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Self-delete fire-21 + fire-22 workflows and patch script
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude Cloud Trigger"
          git pull --rebase origin main
          git rm --ignore-unmatch \
              .github/workflows/axelrod-fire21-patch.yml \
              .github/workflows/axelrod-fire22-dmad-patch.yml \
              scripts/ops/axelrod-fire21-patch.py
          if git diff --cached --quiet; then
            echo "Nothing to remove"
          else
            git commit -m "chore: self-delete axelrod fire-21/fire-22 workflows + patch script"
            git push origin HEAD:main
          fi
