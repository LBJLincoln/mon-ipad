name: Update CLAUDE.md fleet best (brain 2026-04-19)
on:
  push:
    paths: ['.github/workflows/update-claude-md-fleet-best.yml']
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CLAUDE.md patches
        run: |
          python3 << 'PYEOF'
          with open('CLAUDE.md', encoding='utf-8') as fh:
              c = fh.read()

          # 1. Update timestamp
          c = c.replace('Updated: 2026-04-18', 'Updated: 2026-04-19')

          # 2. Fleet best line
          c = c.replace(
              'Fleet best: 0.22085 (S17 ensemble, gen 1142, checkpointed 2026-04-16)',
              'Fleet best: 0.22073 (S22 venn_abers_fusion, gen 39, checkpointed 2026-04-19)'
          )

          # 3. S17 island line — was fleet best, now reset
          c = c.replace(
              '├── S17 LBJLincoln26/nba-evo-s17: ensemble      gen=1142  brier=0.22085  → lbjlincoln26-nba-evo-s17.hf.space  ★ FLEET BEST',
              '├── S17 LBJLincoln26/nba-evo-s17: ensemble      gen=78    brier=0.22340  → lbjlincoln26-nba-evo-s17.hf.space  (reset 2026-04-19, was fleet best)'
          )

          # 4. S22 island line — new fleet best
          c = c.replace(
              '\u2514\u2500\u2500 S22 TESTforge42/nba-evo-s22:  venn_abers_fusion gen=0 brier=\u2014         \u2192 testforge42-nba-evo-s22.hf.space   (NEW 2026-04-15 \u2014 Venn-Abers fusion)',
              '\u2514\u2500\u2500 S22 TESTforge42/nba-evo-s22:  venn_abers_fusion gen=39 brier=0.22073 \u2192 testforge42-nba-evo-s22.hf.space   (promoted 2026-04-19) \u2605 FLEET BEST'
          )

          with open('CLAUDE.md', 'w', encoding='utf-8') as fh:
              fh.write(c)
          print('CLAUDE.md patched OK')
          PYEOF

      - name: Verify key strings present
        run: |
          grep -F "Fleet best: 0.22073" CLAUDE.md && echo "fleet best OK"
          grep -F "venn_abers_fusion gen=39" CLAUDE.md && echo "S22 gen OK"
          grep -F "Updated: 2026-04-19" CLAUDE.md && echo "date OK"

      - name: Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Nomos42 Brain"
          git config user.email "brain@nomos42.ai"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/LBJLincoln/mon-ipad.git"
          git add CLAUDE.md
          git diff --cached --stat
          git commit -m "checkpoint: S22 venn_abers_fusion fleet best 0.22073 (beat 0.22085 by 0.00012)"
          git pull --rebase origin main
          git push

      - name: Self-delete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rm .github/workflows/update-claude-md-fleet-best.yml
          git commit -m "ci: remove update-claude-md-fleet-best workflow (done)"
          git push
