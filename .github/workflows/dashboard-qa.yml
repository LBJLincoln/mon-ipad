name: dashboard-qa
# Cross-repo guardrail: pings TESTforge42/nomos-browser-qa against
# nomosdashboard.vercel.app. Fails on any non-pass result.
#
# Triggered by:
#   - push to main that touches dashboard-adjacent files (cross-repo signal)
#   - daily schedule as a safety net
#   - manual dispatch
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC daily
  push:
    branches: [main]
    paths:
      - "scripts/agents/dashboard_qa_client.py"
      - ".github/workflows/dashboard-qa.yml"

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install httpx
        run: pip install httpx
      - name: Ping browser-qa Space and assert dashboard pass
        env:
          BROWSER_QA_URL: ${{ secrets.BROWSER_QA_URL }}
          DASHBOARD_URL: https://nomosdashboard.vercel.app
        run: python scripts/agents/dashboard_qa_client.py
