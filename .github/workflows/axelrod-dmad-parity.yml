name: axelrod-dmad-parity
on:
  push:
    paths:
      - .github/workflows/axelrod-dmad-parity.yml
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Apply DMAD parity patches to Political TF
        run: |
          python3 << 'PYEOF'
          import sys

          pol_path = "scripts/arena/hf-political-trading-floor/app.py"
          with open(pol_path, encoding="utf-8") as f:
              src = f.read()

          original_len = len(src)

          # PATCH 1: Fix agent count in COLLECTIVE_MISSION (16 → 17)
          old1 = "ONE of 16 LLM agents sharing a political-alpha society bankroll."
          new1 = "ONE of 17 LLM agents sharing a political-alpha society bankroll."
          if old1 not in src:
              print(f"SKIP patch 1: already applied or not found")
          else:
              src = src.replace(old1, new1, 1)
              print(f"Patch 1 OK: agent count 16→17")

          # PATCH 2: Add DMAD ANTI-CONSENSUS GATE to AXELROD_CANON
          old2 = '    "=== END AXELROD CANON ===\\n"\n)'
          dmad_block = (
              '    "=== END AXELROD CANON ===\\n"\n'
              '    "\\n=== DMAD ANTI-CONSENSUS GATE (2026-04-21, binding) ===\\n"\n'
              '    "Cross-TF audit 2026-04-21 flagged POL lockstep at 79–90% on days 62–63 (16/17 agents holding "\n'
              '    "identical picks). This collapses ensemble accuracy ~18% (DMAD, Du 2023) and defeats the 17-agent "\n'
              '    "point of this floor. HARD RULE (overrides breadth/deploy optimizations):\\n"\n'
              '    "  - At least ONE of your top-3 allocations today MUST be an allocation (ticker+direction+event_type tuple) "\n'
              '    "    that is NOT present in the peer_allocations block of COMMON_KNOWLEDGE from yesterday.\\n"\n'
              '    "  - If every top-tier edge is already crowded (\\u226510/17 peers), you MUST dig deeper into the "\n'
              '    "    22-category \\u00d7 7-sector menu to find a non-crowded edge with \\u22650.03 edge. Breadth is the anti-lockstep tool.\\n"\n'
              '    "  - Annotate your non-consensus allocation with tag \'DMAD_DIVERGE\' in allocation.notes. Pure follow-the-herd "\n'
              '    "    picks with no DMAD_DIVERGE will be flagged in the post-mortem.\\n"\n'
              '    "=== END DMAD ANTI-CONSENSUS GATE ===\\n"\n'
              ')'
          )
          if old2 not in src:
              print(f"SKIP patch 2: already applied or not found")
          else:
              src = src.replace(old2, dmad_block, 1)
              print(f"Patch 2 OK: DMAD ANTI-CONSENSUS GATE inserted")

          # Verify
          assert "ONE of 17 LLM agents" in src, "Verification FAIL: agent count"
          assert "DMAD ANTI-CONSENSUS GATE" in src, "Verification FAIL: DMAD gate"

          with open(pol_path, "w", encoding="utf-8") as f:
              f.write(src)
          print(f"Written: {len(src)} chars ({len(src)-original_len:+d} vs original)")
          PYEOF

      - name: Syntax check
        run: python3 -m py_compile scripts/arena/hf-political-trading-floor/app.py && echo "py_compile: PASS"

      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/axelrod-dmad-parity.yml
          git add scripts/arena/hf-political-trading-floor/app.py
          git commit -m "feat(tf): Axelrod DMAD anti-consensus gate parity — Political TF

          Patches hf-political-trading-floor/app.py to match NBA parity:
          1. COLLECTIVE_MISSION: 'ONE of 16 LLM agents' → 'ONE of 17 LLM agents'
             (TRADERS dict has had 17 entries since selfhost-dolphin3 added 2026-04-17)
          2. AXELROD_CANON: add DMAD ANTI-CONSENSUS GATE (binding, 2026-04-21)
             NBA version was added after fire-16 audit; Political was missed.
             Adapted for political context: ticker+direction+event_type tuple,
             22-category × 7-sector menu instead of 100+ NBA category menu.

          py_compile: PASS both apps (NBA 4593 lines, Political 3665 lines)
          do_not_push_hf_space_yet — commit to mon-ipad only, HF push requires user ok

          Co-Authored-By: Claude Cloud Trigger <noreply@anthropic.com>"
          git push
