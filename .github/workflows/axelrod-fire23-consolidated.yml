name: axelrod-fire23-consolidated
on:
  push:
    paths:
      - '.github/workflows/axelrod-fire23-consolidated.yml'
jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0
      - name: Pull latest (avoid push race)
        run: git pull --rebase --autostash origin main
      - name: Run consolidated patch
        run: python3 scripts/ops/axelrod-fire21-patch.py
      - name: Verify py_compile
        run: |
          python3 -m py_compile scripts/arena/hf-llm-trading-floor/app.py && echo "NBA OK"
          python3 -m py_compile scripts/arena/hf-political-trading-floor/app.py && echo "POL OK"
      - name: Commit patches
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude Cloud Trigger"
          git add scripts/arena/hf-llm-trading-floor/app.py \
                  scripts/arena/hf-political-trading-floor/app.py \
                  data/work-queue.json
          git commit -m "feat(tf): Axelrod mechanism A — day-end common knowledge broadcast (both NBA+Political)

          Applies CONSENSUS_AGREE_JUSTIFIED gate + ck_consensus_stance schema field
          to both NBA and Political Trading Floor agents (fires 21+22+cycle1 consolidated).

          Changes:
          - COLLABORATION RULES: CONSENSUS_AGREE_JUSTIFIED replaces blanket FORBIDDEN
          - JSON schema: ck_consensus_stance {stance, reason} added to both TFs
          - write_axelrod_log: ck_consensus_stance captured per-agent in day-N.jsonl
          - work-queue.json: fire-21/22/23 entries added

          Co-Authored-By: Claude Cloud Trigger <noreply@anthropic.com>"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Self-delete orphaned workflows and patch scripts
        run: |
          git pull --rebase --autostash origin main
          git rm --ignore-unmatch \
            .github/workflows/axelrod-fire21-patch.yml \
            .github/workflows/axelrod-fire22-dmad-patch.yml \
            .github/workflows/axelrod-cycle1-mech-a-ck-consensus-field.yml \
            .github/workflows/axelrod-fire23-consolidated.yml \
            scripts/ops/axelrod-fire21-patch.py \
            scripts/ops/apply_axelrod_cycle1_patch.py
          git commit -m "chore: self-delete fire-21/22/cycle1/fire-23 workflows + patch scripts

          Co-Authored-By: Claude Cloud Trigger <noreply@anthropic.com>"
          git push origin HEAD:main
