name: axelrod-fire21-patch
on:
  push:
    paths:
      - '.github/workflows/axelrod-fire21-patch.yml'

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if already patched
        id: check
        run: |
          if grep -q 'CONSENSUS_AGREE_JUSTIFIED' scripts/arena/hf-llm-trading-floor/app.py; then
            echo "already_patched=true" >> $GITHUB_OUTPUT
            echo "Patch already applied, skipping."
          else
            echo "already_patched=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply patch (both NBA + POL app.py + work-queue.json)
        if: steps.check.outputs.already_patched == 'false'
        run: python3 scripts/ops/axelrod-fire21-patch.py

      - name: Commit patched files
        if: steps.check.outputs.already_patched == 'false'
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude Cloud Trigger"
          git add scripts/arena/hf-llm-trading-floor/app.py
          git add scripts/arena/hf-political-trading-floor/app.py
          git add data/work-queue.json
          git commit -m "feat(tf): Axelrod mechanism A — CONSENSUS_AGREE_JUSTIFIED gate (both NBA+Political)

Spec gap: Mech A point 4 requires agents justify 'why they differ OR why they agree
with consensus'. Code had CONSENSUS AGREE FORBIDDEN — added CONSENSUS_AGREE_JUSTIFIED
[peer] (reason=<structural>) as third DMAD option. Explicit justification required;
blind consensus still flags lockstep and triggers Mech B rotation. NBA+POL parity.
verify+tune fire 21.

Co-Authored-By: Claude Cloud Trigger <noreply@anthropic.com>"
          git push

      - name: Self-delete workflow and patch script
        if: steps.check.outputs.already_patched == 'false'
        run: |
          git rm .github/workflows/axelrod-fire21-patch.yml
          git rm scripts/ops/axelrod-fire21-patch.py
          git commit -m "chore: remove axelrod-fire21-patch.yml + patch script (self-delete)"
          git push
