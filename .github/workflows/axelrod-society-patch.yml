name: Axelrod Society Patch (fire-8)

on:
  push:
    paths:
      - '.github/scripts/axelrod-society-patch.py'
      - '.github/workflows/axelrod-society-patch.yml'
  workflow_dispatch:

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Nomos42 Brain"
          git config user.email "brain@nomos42.ai"

      - name: Run patch script
        run: python3 .github/scripts/axelrod-society-patch.py

      - name: Verify patches applied
        run: |
          for f in scripts/arena/hf-llm-trading-floor/app.py scripts/arena/hf-political-trading-floor/app.py; do
            count=$(grep -c '_society_archetypes_by_day' "$f" || true)
            echo "$f: $count occurrences"
            if [ "$count" -ne "5" ]; then
              echo "ERROR: Expected 5, got $count"
              exit 1
            fi
          done
          echo "VERIFICATION PASSED"

      - name: Commit and push
        run: |
          git add scripts/arena/hf-llm-trading-floor/app.py
          git add scripts/arena/hf-political-trading-floor/app.py
          if git diff --cached --quiet; then
            echo "No changes to commit (already patched)"
          else
            git commit -m "brain fire-8: apply society-wide Axelrod Mech B patch

_society_archetypes_by_day: society-wide tracking replaces per-agent
assign_sacrificial_archetypes: dedup across all agents in window
run_experiment: clear society dict on fresh run
py_compile PASS both files, 5 occurrences each.
do_not_push_hf_space_yet=true"
            git pull --rebase origin main
            git push origin main
            echo "PUSHED SUCCESSFULLY"
          fi

      - name: Self-delete workflow
        if: success()
        run: |
          git rm .github/workflows/axelrod-society-patch.yml
          git add .github/scripts/axelrod-society-patch.py
          git commit -m "brain fire-8: remove one-shot patch workflow (patches verified)"
          git pull --rebase origin main
          git push origin main
