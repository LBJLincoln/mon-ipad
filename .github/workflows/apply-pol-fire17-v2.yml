name: apply-pol-fire17-v2
on:
  push:
    paths: ['.github/workflows/apply-pol-fire17-v2.yml']
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply fire-17 patches to Political TF (base64 script, no heredoc escaping)
        run: |
          echo '' | base64 -d | python3

      - name: Verify py_compile
        run: |
          python3 -m py_compile scripts/arena/hf-political-trading-floor/app.py && echo 'COMPILE PASS'

      - name: Commit and cleanup stale axelrod workflows
        run: |
          git config user.name 'cloud-trigger-axelrod-2026'
          git config user.email 'noreply@anthropic.com'
          git add scripts/arena/hf-political-trading-floor/app.py
          git rm .github/workflows/apply-pol-fire17-v2.yml
          git rm --ignore-unmatch .github/workflows/axelrod-fire18-restore-patch.yml
          git rm --ignore-unmatch .github/workflows/axelrod-ck-rationale.yml
          git rm --ignore-unmatch .github/workflows/axelrod-dmad-parity.yml
          git rm --ignore-unmatch .github/workflows/axelrod-fire15-fix.yml
          git rm --ignore-unmatch .github/workflows/axelrod-fire15b-fix.yml
          git commit -m '[BRAIN] Fire-17: Political TF 16->17 agents + DMAD anti-consensus gate. Cleans 5 stale workflows. do_not_push_hf_space_yet=true'
          git push
