name: Axelrod Fire-8 Fix v3

on:
  push:
    paths: ['.github/workflows/axelrod-fire8-fix.yml']
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore good app.py files from known-good commit + patch + compile + commit
        run: |
          set -e
          GOOD=a11786643b159ac2061a5ab50d3bc45e59cfc133
          NBA=scripts/arena/hf-llm-trading-floor/app.py
          POL=scripts/arena/hf-political-trading-floor/app.py

          # Restore both app.py from the good commit (pre-placeholder-push)
          git restore "$GOOD" -- "$NBA" "$POL"
          echo "NBA: $(wc -c < $NBA) bytes"
          echo "POL: $(wc -c < $POL) bytes"
          test $(wc -c < $NBA) -gt 100000 || { echo "NBA restore failed"; exit 1; }
          test $(wc -c < $POL) -gt 80000  || { echo "POL restore failed"; exit 1; }

          # Write patch script to /tmp (avoids heredoc-in-heredoc issues)
          cat > /tmp/patch.py << 'PATCH_EOF'
import sys

ARROW = '\u2192'
DASH  = '\u2014'

OLD_GLOBAL = ('_challenge_assignments: Dict[str, int] = {}'
              '  # Axelrod Mech B: mid-tier tid \u2192 leaderboard rank')
NEW_GLOBAL = (OLD_GLOBAL +
              '\n_society_archetypes_by_day: Dict[str, set] = {}'
              '  # Axelrod Mech B: day_date \u2192 society-wide archetypes used')

OLD_CLEAR = ('    _used_archetypes.clear()'
             '  # Axelrod Mech B: reset archetype history')
NEW_CLEAR = (OLD_CLEAR +
             '\n    _society_archetypes_by_day.clear()'
             '  # Axelrod Mech B: society-wide archetype history')

NEW_BODY = '''def assign_sacrificial_archetypes(day_date: str, state: Dict, agent_logs: Dict,
                                   bottom_n: int = 3, trailing_days: int = 7) -> Dict[str, str]:
    """Axelrod Mech B: bottom-N by trailing delta get NEW archetype from unused pool.

    Society-wide dedup: archetypes used by ANYONE in the prior 7 days are excluded,
    ensuring genuine strategy diversity across the group (not just per-agent).
    """
    deltas = [(tid, compute_trailing_delta(tid, state, agent_logs, trailing_days))
              for tid in state.keys()]
    deltas.sort(key=lambda x: x[1])  # ascending \u2014 worst first
    bottom = [tid for tid, _ in deltas[:bottom_n]]

    # Society-wide used archetypes across trailing window
    trail_dates = sorted(_society_archetypes_by_day.keys())[-trailing_days:]
    society_used: set = set()
    for d in trail_dates:
        society_used.update(_society_archetypes_by_day.get(d, set()))

    assignments: Dict[str, str] = {}
    today_used: set = set()
    for tid in bottom:
        unused = [a for a in AXELROD_ARCHETYPES if a not in society_used and a not in today_used]
        if not unused:
            unused = [a for a in AXELROD_ARCHETYPES if a not in today_used]
        if not unused:
            unused = list(AXELROD_ARCHETYPES)
        pick = unused[hash(tid + day_date) % len(unused)]
        assignments[tid] = pick
        today_used.add(pick)
        _society_archetypes_by_day.setdefault(day_date, set()).add(pick)
    return assignments'''

NBA_OLD = '''def assign_sacrificial_archetypes(day_date: str, state: Dict, agent_logs: Dict,
                                   bottom_n: int = 3, trailing_days: int = 7) -> Dict[str, str]:
    """Axelrod Mech B: bottom-N by trailing delta get NEW archetype from unused pool."""
    deltas = [(tid, compute_trailing_delta(tid, state, agent_logs, trailing_days))
              for tid in state.keys()]
    deltas.sort(key=lambda x: x[1])  # ascending \u2014 worst first
    bottom = [tid for tid, _ in deltas[:bottom_n]]

    assignments: Dict[str, str] = {}
    for tid in bottom:
        unused = [a for a in AXELROD_ARCHETYPES if a not in _used_archetypes[tid]]
        if not unused:
            _used_archetypes[tid].clear()  # exhausted \u2192 rotate again
            unused = list(AXELROD_ARCHETYPES)
        # Deterministic pick by tid-hash for reproducibility
        pick = unused[hash(tid + day_date) % len(unused)]
        assignments[tid] = pick
        _used_archetypes[tid].add(pick)
    return assignments'''

POL_OLD = '''def assign_sacrificial_archetypes(day_date: str, state: Dict, agent_logs: Dict,
                                   bottom_n: int = 3, trailing_days: int = 7) -> Dict[str, str]:
    """Axelrod Mech B: bottom-N by trailing delta get NEW archetype from unused pool."""
    deltas = [(tid, compute_trailing_delta(tid, state, agent_logs, trailing_days))
              for tid in state.keys()]
    deltas.sort(key=lambda x: x[1])
    bottom = [tid for tid, _ in deltas[:bottom_n]]
    assignments: Dict[str, str] = {}
    for tid in bottom:
        unused = [a for a in AXELROD_ARCHETYPES if a not in _used_archetypes[tid]]
        if not unused:
            _used_archetypes[tid].clear()
            unused = list(AXELROD_ARCHETYPES)
        pick = unused[hash(tid + day_date) % len(unused)]
        assignments[tid] = pick
        _used_archetypes[tid].add(pick)
    return assignments'''

errors = []
for path, old_body in [
    ('scripts/arena/hf-llm-trading-floor/app.py', NBA_OLD),
    ('scripts/arena/hf-political-trading-floor/app.py', POL_OLD),
]:
    with open(path) as f:
        c = f.read()
    label = 'NBA' if 'nba' in path else 'POL'
    for name, old, new in [('GLOBAL', OLD_GLOBAL, NEW_GLOBAL),
                           ('CLEAR',  OLD_CLEAR,  NEW_CLEAR),
                           ('BODY',   old_body,   NEW_BODY)]:
        cnt = c.count(old)
        if cnt != 1:
            errors.append(f'{label} {name}: count={cnt} (expected 1)')
            continue
        c = c.replace(old, new, 1)
    n = c.count('_society_archetypes_by_day')
    if n != 5:
        errors.append(f'{label}: {n} occurrences of _society_archetypes_by_day (expected 5)')
    else:
        with open(path, 'w') as f:
            f.write(c)
        print(f'{label}: patched OK ({len(c)} chars, {n} occurrences)')

if errors:
    for e in errors: print(f'ERROR: {e}', file=sys.stderr)
    sys.exit(1)
PATCH_EOF

          python3 /tmp/patch.py

          # py_compile gate
          python3 -m py_compile "$NBA" && echo "NBA COMPILE PASS"
          python3 -m py_compile "$POL" && echo "POL COMPILE PASS"

