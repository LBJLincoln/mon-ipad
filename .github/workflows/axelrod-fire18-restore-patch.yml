name: axelrod-fire18-restore-patch
on:
  push:
    paths: ['.github/workflows/axelrod-fire18-restore-patch.yml']
  workflow_dispatch:
jobs:
  restore-and-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Political app.py from pre-stub commit and apply DMAD patches
        run: |
          PRE_STUB_SHA="918cc673071eb2e5ef006f01ffe7bc334b9a027b"
          TARGET="scripts/arena/hf-political-trading-floor/app.py"
          git show "${PRE_STUB_SHA}:${TARGET}" > /tmp/political_orig.py
          echo "Restored: $(wc -l < /tmp/political_orig.py) lines"
          python3 << 'PYEOF'
          with open('/tmp/political_orig.py') as f:
              code = f.read()

          # Patch 1: Fix agent count 16 -> 17
          OLD1 = '"You are ONE of 16 LLM agents sharing a political-alpha society bankroll. All 16 agents see "'
          NEW1 = '"You are ONE of 17 LLM agents sharing a political-alpha society bankroll. All 17 agents see "'
          assert OLD1 in code, "PATCH 1 TARGET NOT FOUND"
          code = code.replace(OLD1, NEW1, 1)
          print("Patch 1 APPLIED: agent count 16->17")

          # Patch 2: Add DMAD ANTI-CONSENSUS GATE after END AXELROD CANON
          OLD2 = (
              '"=== END AXELROD CANON ===\\n"\n'
              ')\n'
              '\n'
              '# Axelrod Mech D — cooperation ledger (political)'
          )
          NEW2 = (
              '"=== END AXELROD CANON ===\\n"\n'
              '    "\\n=== DMAD ANTI-CONSENSUS GATE (2026-04-21, binding) ===\\n"\n'
              '    "Cross-TF audit 2026-04-21 flagged Political lockstep where agents converged to "\n'
              '    "identical $93.92/$159.68 bankrolls. This collapses ensemble accuracy ~18% (DMAD, "\n'
              '    "Du 2023) and defeats the 17-agent point of this floor. "\n'
              '    "HARD RULE (overrides breadth/deploy optimizations):\\n"\n'
              '    "  - At least ONE of your top-3 allocations today MUST be a trade "\n'
              '    "    (event_idx+ticker+direction tuple) that is NOT present in the "\n'
              '    "    peer_allocations block of COMMON_KNOWLEDGE from yesterday.\\n"\n'
              '    "  - If every top-tier edge is already crowded (\\u226510/17 peers), you MUST "\n'
              '    "    dig deeper into the 7-sector SPDR menu (XLF/XLE/XLV/XLI/XLK/XLC/XLY) + "\n'
              '    "    individual stocks to find a non-crowded signal with \\u22650.03 edge. "\n'
              '    "    Breadth is the anti-lockstep tool.\\n"\n'
              '    "  - Annotate your non-consensus trade with tag \'DMAD_DIVERGE\' in "\n'
              '    "    allocation.notes. Pure follow-the-herd picks with no DMAD_DIVERGE will "\n'
              '    "    be flagged in the post-mortem.\\n"\n'
              '    "=== END DMAD ANTI-CONSENSUS GATE ===\\n"\n'
              ')\n'
              '\n'
              '# Axelrod Mech D — cooperation ledger (political)'
          )
          assert OLD2 in code, "PATCH 2 TARGET NOT FOUND"
          code = code.replace(OLD2, NEW2, 1)
          print("Patch 2 APPLIED: DMAD ANTI-CONSENSUS GATE added")

          assert "ONE of 17" in code
          assert "DMAD ANTI-CONSENSUS GATE" in code
          assert "ONE of 16" not in code
          print("All assertions passed")
          print("Lines:", code.count('\n'))

          with open('scripts/arena/hf-political-trading-floor/app.py', 'w') as f:
              f.write(code)
          PYEOF

      - name: Verify Python compilation
        run: |
          python3 -m py_compile scripts/arena/hf-political-trading-floor/app.py
          echo "COMPILE OK: $(wc -l < scripts/arena/hf-political-trading-floor/app.py) lines"

      - name: Commit patched file and self-delete workflow
        run: |
          git config user.name "cloud-trigger-axelrod-2026"
          git config user.email "noreply@anthropic.com"
          git add scripts/arena/hf-political-trading-floor/app.py
          git rm .github/workflows/axelrod-fire18-restore-patch.yml
          git commit -m "feat(tf): Axelrod fire-18 — DMAD parity + agent count fix (Political TF)

Apply fire-17 patches that were py_compile verified but never committed:
- Political COLLECTIVE_MISSION: ONE of 16 LLM agents -> ONE of 17 LLM agents
- Political AXELROD_CANON: DMAD ANTI-CONSENSUS GATE block added (political
  ticker+direction+event_type flavour, matching NBA gate added 2026-04-21)
py_compile PASS: NBA 4625 lines, Political 3688 lines.
do_not_push_hf_space_yet: true (human review required before HF deploy)

Co-Authored-By: Claude Cloud Trigger <noreply@anthropic.com>"
          git push
