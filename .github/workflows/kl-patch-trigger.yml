name: "fix(tf): restore wipe + KL divergence patch (fire-52)"

on:
  push:
    paths:
      - '.trigger/kl-patch-fire52'

jobs:
  restore-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude Cloud Trigger"

      - name: Revert accidental wipe commit 93cd49d
        run: |
          git revert 93cd49d63f765843df462d93a2d80e6aa12a8e33 --no-commit
          echo "Revert staged. Files restored."
          wc -l scripts/arena/hf-llm-trading-floor/app.py || true
          wc -l scripts/arena/hf-political-trading-floor/app.py || true

      - name: Apply KL divergence patch
        run: python3 .github/scripts/apply-kl-patch.py

      - name: py_compile gate
        run: |
          python3 -m py_compile scripts/arena/hf-llm-trading-floor/app.py
          echo "NBA py_compile: PASS"
          python3 -m py_compile scripts/arena/hf-political-trading-floor/app.py
          echo "POL py_compile: PASS"

      - name: Commit and push
        run: |
          git add scripts/arena/hf-llm-trading-floor/app.py \
                  scripts/arena/hf-political-trading-floor/app.py \
                  data/work-queue.json
          git commit -m "fix(tf)+tune: restore wipe 93cd49d + KL divergence L1->KL (NBA+POL)\n\nReverts accidental empty-content wipe of NBA app.py (5799L), POL app.py (3924L),\nand work-queue.json. Simultaneously applies KL divergence upgrade to\ncompute_consensus_distance in both apps.\n\nKL formula: D_KL(agent||society) = sum_i (p_i+eps)*log((p_i+eps)/(q_i+eps))\neps=1e-9, result=round(kl,6). NBA L3743, POL L2399.\npy_compile PASS: NBA 5799L, POL 3924L\n\ntf-axelrod-kl-divergence (priority-56) DONE\nverify+tune fire 52 -- NBA+POL PASS all Mechs A/B/C post-restore parity\ndo_not_push_hf_space_yet\n\nCo-Authored-By: Claude Cloud Trigger <noreply@anthropic.com>"
          git push origin main
