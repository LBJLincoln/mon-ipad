name: Trading Floor 10-Agent Competition

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: full or lite'
        required: false
        default: 'full'
  schedule:
    # Every 4 hours at :45 (slot D — staggered from backtest :25)
    - cron: '45 2,6,10,14,18,22 * * *'

permissions:
  contents: write

jobs:
  nba-trading:
    name: NBA Trading Floor (10 agents)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout nomos-nba-agent (game + odds data)
        uses: actions/checkout@v4
        with:
          repository: LBJLincoln/nomos-nba-agent
          path: nomos-nba-agent

      - name: Symlink nomos-nba-agent to parent directory
        run: ln -sfn "$GITHUB_WORKSPACE/nomos-nba-agent" "$GITHUB_WORKSPACE/../nomos-nba-agent"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Run 10-Agent Real LLM Trading Floor (batch)
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
          OPENROUTER_KEY_ORCHESTRATOR: ${{ secrets.OPENROUTER_KEY_ORCHESTRATOR }}
          OPENROUTER_KEY_PME: ${{ secrets.OPENROUTER_KEY_PME }}
          OPENROUTER_KEY_BARTOLI: ${{ secrets.OPENROUTER_KEY_BARTOLI }}
        run: |
          mkdir -p data/arena
          python3 scripts/arena/trading-floor-10agents-cli.py --games 15 \
            2>&1 | tail -80

      - name: Run Political Trading Floor iteration
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
          OPENROUTER_KEY_ORCHESTRATOR: ${{ secrets.OPENROUTER_KEY_ORCHESTRATOR }}
          OPENROUTER_KEY_PME: ${{ secrets.OPENROUTER_KEY_PME }}
        run: |
          mkdir -p data/arena/political
          if [ -f scripts/arena/political-trading-floor.py ]; then
            python3 scripts/arena/political-trading-floor.py 2>&1 | tail -40
          fi
        continue-on-error: true

      - name: Commit trading results
        run: |
          git config user.name "Trading Floor Bot"
          git config user.email "trading@nomos42.ai"
          git add data/arena/trading-floor-10agents-state.json \
                  data/arena/trading-floor-10agents-latest.json \
                  data/arena/political/ \
                  2>/dev/null || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop || true
            git add data/arena/trading-floor-10agents-state.json \
                    data/arena/trading-floor-10agents-latest.json \
                    data/arena/political/ \
                    2>/dev/null || true
            git commit -m "data: trading floor 10-agent iteration $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3; do
              git pull --rebase || true
              git push && break
              echo "Push attempt $attempt failed, retrying..."
              git pull --rebase origin main || true
            done
          else
            echo "No trading changes to commit"
          fi

  political-backtest:
    name: Political Backtest Swarm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install scikit-learn numpy

      - name: Run Political backtest swarm
        run: |
          if [ -f scripts/arena/continuous-political-backtest-swarm.sh ]; then
            bash scripts/arena/continuous-political-backtest-swarm.sh 2>&1 | tail -30
          else
            echo "Political backtest script not found, skipping"
          fi
        continue-on-error: true

      - name: Commit political results
        run: |
          git config user.name "Trading Floor Bot"
          git config user.email "trading@nomos42.ai"
          git add data/arena/political/ 2>/dev/null || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop || true
            git add data/arena/political/ 2>/dev/null || true
            git commit -m "data: political backtest $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3; do
              git pull --rebase || true
              git push && break
              echo "Push attempt $attempt failed, retrying..."
              git pull --rebase origin main || true
            done
          else
            echo "No political changes to commit"
          fi
