name: Trading Floor Monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: status or trigger'
        required: false
        default: 'status'
  schedule:
    # Every 4 hours at :45 (slot D — staggered from backtest :25)
    - cron: '45 2,6,10,14,18,22 * * *'

permissions:
  contents: write

jobs:
  # ── NBA TRADING FLOOR: HF Space is primary, GH Action just monitors ──
  nba-trading-monitor:
    name: NBA Trading Floor Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check HF Trading Floor Space status
        run: |
          echo "=== Nomos42 Trading Floor Status ==="
          # Get status from HF Space API
          STATUS=$(curl -s --max-time 15 \
            "https://lbjlincoln26-nba-llm-trading-floor.hf.space/api/status" || echo '{"error":"unreachable"}')
          echo "$STATUS" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(f\"Running: {d.get('running', '?')}\")
              print(f\"Games: {d.get('games_processed', '?')}/{d.get('games_total', '?')}\")
              print(f\"LLM calls: {d.get('llm_calls', '?')} (fails: {d.get('llm_failures', '?')})\")
              if d.get('agents'):
                  for tid, ts in sorted(d['agents'].items(), key=lambda x: -x[1].get('bankroll', 0)):
                      print(f\"  {tid:12s} \${ts.get('bankroll',100):>8.2f}  bets={ts.get('total_bets',0)}\")
          except:
              print(f'Raw: {d}' if 'd' in dir() else 'Failed to parse')
          "

          # Get leaderboard
          echo ""
          echo "=== Leaderboard ==="
          curl -s --max-time 15 \
            "https://lbjlincoln26-nba-llm-trading-floor.hf.space/api/leaderboard" \
            | python3 -m json.tool 2>/dev/null | head -40 || echo "Leaderboard unavailable"

          # Save status to file for commit
          mkdir -p data/arena
          echo "$STATUS" > data/arena/trading-floor-status.json

      - name: Check LLM Gateway health
        run: |
          echo "=== LLM Gateway Status ==="
          curl -s --max-time 10 \
            "https://lbjlincoln26-llm-gateway.hf.space/gradio_api/call/list_models" \
            -X POST -H "Content-Type: application/json" -d '{"data": []}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('event_id','no event'))" 2>/dev/null \
            && echo "Gateway: RESPONDING" || echo "Gateway: DOWN"

      - name: Commit status snapshot
        run: |
          git config user.name "Trading Floor Bot"
          git config user.email "trading@nomos42.ai"
          git add data/arena/trading-floor-status.json 2>/dev/null || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop || true
            git add data/arena/trading-floor-status.json 2>/dev/null || true
            git commit -m "data: trading floor status $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3; do
              git pull --rebase || true
              git push && break
              echo "Push attempt $attempt failed, retrying..."
              git pull --rebase origin main || true
            done
          else
            echo "No status changes to commit"
          fi

  # ── POLITICAL TRADING FLOOR: HF Space is primary, GH Action just monitors ──
  political-trading-monitor:
    name: Political Trading Floor Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Political HF Space status
        run: |
          echo "=== Nomos42 Political Trading Floor Status ==="
          STATUS=$(curl -s --max-time 15 \
            "https://lbjlincoln26-political-llm-trading-floor.hf.space/api/status" || echo '{"error":"unreachable"}')
          echo "$STATUS" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(f\"Running: {d.get('running', '?')}\")
              print(f\"Events: {d.get('events_processed', '?')}/{d.get('events_total', '?')}\")
              print(f\"Days: {d.get('days_processed', '?')}/{d.get('days_total', '?')}\")
              print(f\"LLM calls: {d.get('llm_calls', '?')} (fails: {d.get('llm_failures', '?')})\")
              if d.get('agents'):
                  for tid, ts in sorted(d['agents'].items(), key=lambda x: -x[1].get('bankroll', 0)):
                      print(f\"  {tid:14s} \${ts.get('bankroll',100):>8.2f}  bets={ts.get('total_bets',0)}\")
          except Exception as e:
              print(f'Parse failed: {e}')
          "
          echo ""
          echo "=== Political Leaderboard ==="
          curl -s --max-time 15 \
            "https://lbjlincoln26-political-llm-trading-floor.hf.space/api/leaderboard" \
            | python3 -m json.tool 2>/dev/null | head -40 || echo "Leaderboard unavailable"

          mkdir -p data/arena/political
          echo "$STATUS" > data/arena/political/political-trading-floor-status.json

      - name: Commit political status snapshot
        run: |
          git config user.name "Trading Floor Bot"
          git config user.email "trading@nomos42.ai"
          git add data/arena/political/political-trading-floor-status.json 2>/dev/null || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop || true
            git add data/arena/political/political-trading-floor-status.json 2>/dev/null || true
            git commit -m "data: political TF status $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3; do
              git pull --rebase || true
              git push && break
              echo "Push attempt $attempt failed, retrying..."
              git pull --rebase origin main || true
            done
          else
            echo "No political status changes to commit"
          fi
