name: Trading Floor Monitor + Watchdog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: status or trigger'
        required: false
        default: 'status'
  schedule:
    # Every 2 hours (was 4h — tighter monitoring after repeated TF deaths)
    - cron: '45 */2 * * *'

permissions:
  contents: write

env:
  NBA_URL: https://lbjlincoln26-nba-llm-trading-floor.hf.space
  POL_URL: https://lbjlincoln26-political-llm-trading-floor.hf.space
  GW_URL: https://lbjlincoln26-llm-gateway.hf.space

jobs:
  watchdog:
    name: TF Watchdog (NBA + Political)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: NBA — check + restart if dead
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_2 }}
        run: |
          echo "=== NBA Trading Floor ==="
          STATUS=$(curl -s --max-time 20 "$NBA_URL/api/status" || echo '{"error":"unreachable"}')

          # Parse status
          RUNNING=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('running','error'))" 2>/dev/null || echo "error")
          CALLS=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('llm_calls',0))" 2>/dev/null || echo "0")
          BEST=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('fleet_best_bankroll',0))" 2>/dev/null || echo "0")
          LEADER=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('fleet_leader','none'))" 2>/dev/null || echo "none")
          DEAD=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('provider_health',{}).get('providers_dead',{})))" 2>/dev/null || echo "?")
          OK=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('provider_health',{}).get('providers_ok',[])))" 2>/dev/null || echo "?")

          echo "  running=$RUNNING | llm_calls=$CALLS | best=\$$BEST | leader=$LEADER"
          echo "  providers: $OK ok / $DEAD dead"

          # STALE HEARTBEAT check: running=True but 'updated' > 10min old = hung
          STALE=$(echo "$STATUS" | python3 -c "
          import sys, json
          from datetime import datetime, timezone
          try:
              d = json.load(sys.stdin)
              u = d.get('updated')
              if not u or not d.get('running'): print('no'); sys.exit(0)
              dt = datetime.fromisoformat(u.replace('Z','+00:00'))
              age = (datetime.now(timezone.utc) - dt).total_seconds()
              print('yes' if age > 600 else 'no', int(age))
          except Exception as e:
              print('no')
          " 2>/dev/null || echo "no")

          # WATCHDOG: restart if not running OR hung (stale heartbeat)
          if [ "$RUNNING" = "False" ] || [ "$RUNNING" = "error" ] || [[ "$STALE" == yes* ]]; then
            if [[ "$STALE" == yes* ]]; then
              echo "  ⚠️  NBA TF HUNG (stale heartbeat: $STALE) — FACTORY REBOOT"
              pip install -q huggingface_hub 2>/dev/null
              python3 -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.restart_space('LBJLincoln26/nba-llm-trading-floor', factory_reboot=True)
          print('  NBA factory_reboot triggered')
          " 2>&1 || echo "  HF factory reboot failed"
            else
              echo "  ⚠️  NBA TF NOT RUNNING — restarting via /api/run"
              RESTART=$(curl -s --max-time 20 -X POST "$NBA_URL/api/run" || echo '{"error":"failed"}')
              echo "  restart response: $RESTART"

              if [ "$RUNNING" = "error" ]; then
                echo "  ⚠️  Space unreachable — attempting HF Space restart"
                pip install -q huggingface_hub 2>/dev/null
                python3 -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.restart_space('LBJLincoln26/nba-llm-trading-floor')
          print('  HF Space restart triggered')
          " 2>&1 || echo "  HF restart failed"
              fi
            fi
          else
            echo "  ✓ NBA TF running normally"
          fi

          # Save status
          mkdir -p data/arena
          echo "$STATUS" > data/arena/trading-floor-status.json

      - name: Political — check + restart if dead
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_2 }}
        run: |
          echo "=== Political Trading Floor ==="
          STATUS=$(curl -s --max-time 20 "$POL_URL/api/status" || echo '{"error":"unreachable"}')

          RUNNING=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('running','error'))" 2>/dev/null || echo "error")
          CALLS=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('llm_calls',0))" 2>/dev/null || echo "0")
          BEST=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('fleet_best_bankroll',0))" 2>/dev/null || echo "0")
          LEADER=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('fleet_leader','none'))" 2>/dev/null || echo "none")
          DEAD=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('provider_health',{}).get('providers_dead',{})))" 2>/dev/null || echo "?")
          OK=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('provider_health',{}).get('providers_ok',[])))" 2>/dev/null || echo "?")

          echo "  running=$RUNNING | llm_calls=$CALLS | best=\$$BEST | leader=$LEADER"
          echo "  providers: $OK ok / $DEAD dead"

          STALE=$(echo "$STATUS" | python3 -c "
          import sys, json
          from datetime import datetime, timezone
          try:
              d = json.load(sys.stdin)
              u = d.get('updated')
              if not u or not d.get('running'): print('no'); sys.exit(0)
              dt = datetime.fromisoformat(u.replace('Z','+00:00'))
              age = (datetime.now(timezone.utc) - dt).total_seconds()
              print('yes' if age > 600 else 'no', int(age))
          except Exception:
              print('no')
          " 2>/dev/null || echo "no")

          if [ "$RUNNING" = "False" ] || [ "$RUNNING" = "error" ] || [[ "$STALE" == yes* ]]; then
            if [[ "$STALE" == yes* ]]; then
              echo "  ⚠️  POL TF HUNG (stale heartbeat: $STALE) — FACTORY REBOOT"
              pip install -q huggingface_hub 2>/dev/null
              python3 -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.restart_space('LBJLincoln26/political-llm-trading-floor', factory_reboot=True)
          print('  POL factory_reboot triggered')
          " 2>&1 || echo "  HF factory reboot failed"
            else
              echo "  ⚠️  POL TF NOT RUNNING — restarting via /api/run"
              RESTART=$(curl -s --max-time 20 -X POST "$POL_URL/api/run" || echo '{"error":"failed"}')
              echo "  restart response: $RESTART"

              if [ "$RUNNING" = "error" ]; then
                echo "  ⚠️  Space unreachable — attempting HF Space restart"
                pip install -q huggingface_hub 2>/dev/null
                python3 -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.restart_space('LBJLincoln26/political-llm-trading-floor')
          print('  HF Space restart triggered')
          " 2>&1 || echo "  HF restart failed"
              fi
            fi
          else
            echo "  ✓ POL TF running normally"
          fi

          mkdir -p data/arena/political
          echo "$STATUS" > data/arena/political/political-trading-floor-status.json

      - name: Gateway health check
        run: |
          echo "=== LLM Gateway ==="
          GW_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$GW_URL/api/status" || echo "000")
          if [ "$GW_CODE" = "200" ]; then
            echo "  ✓ Gateway alive (HTTP $GW_CODE)"
          else
            echo "  ⚠️  Gateway down (HTTP $GW_CODE)"
          fi

      - name: Sync Axelrod logs (NBA + Political)
        run: |
          # NBA axelrod logs
          mkdir -p data/arena/axelrod-log
          AXELROD=$(curl -s --max-time 20 "$NBA_URL/api/axelrod-log" || echo '{}')
          echo "$AXELROD" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          written = 0
          for fname, lines in d.get('files', {}).items():
              with open(f'data/arena/axelrod-log/{fname}', 'w') as f:
                  f.write(lines)
              written += 1
          print(f'NBA axelrod: {written} day files')
          " 2>/dev/null || echo "NBA axelrod: no data"

          # Political axelrod logs
          mkdir -p data/arena/axelrod-log-political
          AXELROD_POL=$(curl -s --max-time 20 "$POL_URL/api/axelrod-log" || echo '{}')
          echo "$AXELROD_POL" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          written = 0
          for fname, lines in d.get('files', {}).items():
              with open(f'data/arena/axelrod-log-political/{fname}', 'w') as f:
                  f.write(lines)
              written += 1
          print(f'POL axelrod: {written} day files')
          " 2>/dev/null || echo "POL axelrod: no data"

      - name: Commit snapshots
        run: |
          git config user.name "Trading Floor Bot"
          git config user.email "trading@nomos42.ai"
          git add data/arena/ 2>/dev/null || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop || true
            git add data/arena/ 2>/dev/null || true
            git commit -m "data: TF watchdog $(date -u +%Y-%m-%dT%H:%MZ) [auto-restart if dead]"
            for attempt in 1 2 3; do
              git pull --rebase || true
              git push && break
              echo "Push attempt $attempt failed, retrying..."
              git pull --rebase origin main || true
            done
          else
            echo "No changes to commit"
          fi
