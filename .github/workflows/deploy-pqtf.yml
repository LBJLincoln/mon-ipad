name: Deploy PQTF to HF Space

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/arena/hf-political-quant-trading-floor/**'

permissions:
  contents: read

jobs:
  deploy:
    name: Upload PQTF source → LBJLincoln26/political-quant-trading-floor
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install huggingface_hub
        run: pip install -q huggingface_hub
      - name: Upload changed files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_2 }}
        run: |
          python3 <<'PY'
          import os, pathlib
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = 'LBJLincoln26/political-quant-trading-floor'
          src = pathlib.Path('scripts/arena/hf-political-quant-trading-floor')
          files = [
              'app.py', 'engine.py', 'requirements.txt', 'README.md',
              'gateway_client.py', 'intraday_paths.py', 'options.py',
              'provider_health.py', 'session_data.py', 'spreads.py',
          ]
          for f in files:
              p = src / f
              if not p.exists():
                  print(f"[deploy-pqtf] skip missing: {f}"); continue
              try:
                  api.upload_file(path_or_fileobj=str(p), path_in_repo=f,
                                  repo_id=repo, repo_type='space',
                                  commit_message=f'deploy: {f}')
                  print(f"[deploy-pqtf] uploaded: {f}")
              except Exception as e:
                  print(f"[deploy-pqtf] FAILED {f}: {type(e).__name__}: {e}")
          PY
