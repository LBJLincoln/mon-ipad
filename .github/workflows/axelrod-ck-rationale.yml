name: axelrod-ck-rationale
on:
  push:
    paths:
      - '.github/workflows/axelrod-ck-rationale.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply CK rationale patch + update work-queue
        run: |
          python3 << 'PYEOF'
          import pathlib, sys, json
          from datetime import datetime, timezone

          NBA = pathlib.Path("scripts/arena/hf-llm-trading-floor/app.py")
          POL = pathlib.Path("scripts/arena/hf-political-trading-floor/app.py")
          WQ  = pathlib.Path("data/work-queue.json")

          NBA_OLD = (
              '                for a in allocs:\n'
              '                    outcome = "W" if a["won"] else "L"\n'
              '                    lines.append(\n'
              "                        f\"  {name}: {a['game']} {a['category']} \"\n"
              "                        f\"${a.get('stake', 0):.1f} edge={a['edge']:.3f}→{outcome} \"\n"
              "                        f\"pnl={a.get('profit', 0):+.1f}\")"
          )
          NBA_NEW = (
              '                for a in allocs:\n'
              '                    outcome = "W" if a["won"] else "L"\n'
              "                    _rat = (a.get('rationale') or '')[:60]\n"
              "                    _rat_sfx = f' [{_rat}]' if _rat else ''\n"
              '                    lines.append(\n'
              "                        f\"  {name}: {a['game']} {a['category']} \"\n"
              "                        f\"${a.get('stake', 0):.1f} edge={a.get('edge', 0):.3f}→{outcome} \"\n"
              "                        f\"pnl={a.get('profit', 0):+.1f}{_rat_sfx}\")"
          )
          POL_OLD = (
              '                for a in allocs:\n'
              '                    outcome = "W" if a["won"] else "L"\n'
              '                    lines.append(\n'
              "                        f\"  {name}: {a['ticker']} {a['direction']} {a.get('event_type', '?')} \"\n"
              "                        f\"${a.get('stake', 0):.1f} edge={a.get('edge', 0):.3f}→{outcome} \"\n"
              "                        f\"pnl={a.get('profit', 0):+.1f}\")"
          )
          POL_NEW = (
              '                for a in allocs:\n'
              '                    outcome = "W" if a["won"] else "L"\n'
              "                    _rat = (a.get('rationale') or a.get('thesis') or '')[:60]\n"
              "                    _rat_sfx = f' [{_rat}]' if _rat else ''\n"
              '                    lines.append(\n'
              "                        f\"  {name}: {a['ticker']} {a['direction']} {a.get('event_type', '?')} \"\n"
              "                        f\"${a.get('stake', 0):.1f} edge={a.get('edge', 0):.3f}→{outcome} \"\n"
              "                        f\"pnl={a.get('profit', 0):+.1f}{_rat_sfx}\")"
          )

          def patch(path, old, new, label):
              content = path.read_text(encoding='utf-8')
              if old in content:
                  path.write_text(content.replace(old, new, 1), encoding='utf-8')
                  print(f"[OK] {label}: patch applied")
                  return True
              elif new in content:
                  print(f"[SKIP] {label}: already patched")
                  return True
              print(f"[FAIL] {label}: target string not found", file=sys.stderr)
              return False

          ok = patch(NBA, NBA_OLD, NBA_NEW, "NBA") and patch(POL, POL_OLD, POL_NEW, "POL")
          if not ok:
              sys.exit(1)

          wq = json.loads(WQ.read_text())
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          for item in wq["items"]:
              if item["id"] == "tf-axelrod-ck-rationale":
                  item["status"] = "done"
                  item["completed_at"] = now
                  item["py_compile"] = "PASS both apps"
          existing_ids = {i["id"] for i in wq["items"]}
          if "tf-axelrod-verify-tune-16" not in existing_ids:
              wq["items"].append({
                  "id": "tf-axelrod-verify-tune-16",
                  "priority": 25,
                  "status": "pending",
                  "owner": "cloud-trigger-axelrod-2026",
                  "subject": "verify+tune fire 16 -- confirm CK rationale applied + spec re-audit",
                  "do_not_push_hf_space_yet": True,
              })
          wq["updated_at"] = now
          WQ.write_text(json.dumps(wq, indent=2))
          print("[OK] work-queue.json updated")
          PYEOF

      - name: py_compile verification
        run: |
          python3 -m py_compile scripts/arena/hf-llm-trading-floor/app.py && echo "NBA py_compile PASS"
          python3 -m py_compile scripts/arena/hf-political-trading-floor/app.py && echo "POL py_compile PASS"

      - name: Commit and push
        run: |
          git config user.email "axelrod-trigger@nomos42.ai"
          git config user.name "Axelrod-2026 Cloud Trigger"
          git add scripts/arena/hf-llm-trading-floor/app.py \
                  scripts/arena/hf-political-trading-floor/app.py \
                  data/work-queue.json
          if git diff --cached --quiet; then
            echo "Nothing to commit - already patched"
            exit 0
          fi
          git commit -m "feat(tf): Axelrod CK rationale -- edge_rationale in COMMON_KNOWLEDGE block (NBA+POL) [skip ci]" \
                     -m "Closes tf-axelrod-ck-rationale: per-bet rationale text (<=60 chars) appended to each allocation line in COMMON_KNOWLEDGE[D]. Agents can now see WHY peers bet (reasoning template in use), not just WHAT game/category. NBA: a.get(rationale)[:60]. POL: a.get(rationale)||a.get(thesis)[:60]. Also fixes NBA edge lookup: a.get(edge,0) instead of a[edge] (KeyError guard). py_compile: PASS both apps." \
                     -m "Co-Authored-By: Claude Cloud Trigger <noreply@anthropic.com>"
          git push
