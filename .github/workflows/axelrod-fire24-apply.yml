name: axelrod-fire24-apply
on:
  push:
    paths:
      - '.github/workflows/axelrod-fire24-apply.yml'
jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0
      - name: Pull latest (avoid push race)
        run: git pull --rebase --autostash origin main
      - name: Run consolidated patch
        run: python3 scripts/ops/axelrod-fire21-patch.py
      - name: Verify py_compile
        run: |
          python3 -m py_compile scripts/arena/hf-llm-trading-floor/app.py && echo "NBA OK"
          python3 -m py_compile scripts/arena/hf-political-trading-floor/app.py && echo "POL OK"
      - name: Commit patches
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude Cloud Trigger"
          git add scripts/arena/hf-llm-trading-floor/app.py \
                  scripts/arena/hf-political-trading-floor/app.py \
                  data/work-queue.json
          git diff --cached --quiet && echo "patches already applied" || \
          git commit -m "feat(tf): Axelrod fire-24 — CONSENSUS_AGREE_JUSTIFIED + ck_consensus_stance (NBA+Political)

Applies 7 patches (fires 21+22+23 consolidated, applied on fire 24):
- NBA+POL: CONSENSUS AGREE is FORBIDDEN -> CONSENSUS_AGREE_JUSTIFIED gate
- NBA+POL: schema — ck_consensus_stance {stance, reason} field added
- NBA+POL: write_axelrod_log — ck_consensus_stance captured in day-N.jsonl
- POL: AUDIT FIELDS — ck_consensus_stance documented as MANDATORY
- work-queue.json: fire-21/22/23/24 entries added

do_not_push_hf_space_yet: true

Co-Authored-By: Claude Cloud Trigger <noreply@anthropic.com>"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Self-delete orphaned workflows and patch scripts
        run: |
          git pull --rebase --autostash origin main
          git rm --ignore-unmatch \
            .github/workflows/axelrod-fire21-patch.yml \
            .github/workflows/axelrod-fire22-dmad-patch.yml \
            .github/workflows/axelrod-cycle1-mech-a-ck-consensus-field.yml \
            .github/workflows/axelrod-fire23-consolidated.yml \
            .github/workflows/axelrod-fire24-apply.yml \
            scripts/ops/axelrod-fire21-patch.py \
            scripts/ops/apply_axelrod_cycle1_patch.py
          git diff --cached --quiet && echo "nothing to delete" || \
          git commit -m "chore: self-delete fire-21/22/23/24 orphaned workflows + patch scripts

Co-Authored-By: Claude Cloud Trigger <noreply@anthropic.com>"
          git push origin HEAD:main || true
