name: Fix CK hardcoded count (brain R19)
on:
  push:
    paths: ['.github/workflows/fix-ck-hardcoded.yml']
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write patch script
        run: |
          cat > /tmp/patch.py << 'PYEOF'
          NBA = 'scripts/arena/hf-llm-trading-floor/app.py'
          POL = 'scripts/arena/hf-political-trading-floor/app.py'
          OLD_CM = 'You are ONE of 16 LLM agents sharing a society bankroll. All 16 agents see the SAME data: '
          NEW_CM = 'You are ONE of 17 LLM agents sharing a society bankroll. All 17 agents see the SAME data: '
          OLD2 = (
              '    lines = [\n'
              '        f"=== COMMON KNOWLEDGE \u2014 Day {day_date} (full transparency) ===",\n'
              '        f"COLLECTIVE GOAL: maximize TOTAL GROUP bankroll \u2192 target $1,200 ($100\xd712 start).",\n'
              '        f"You are ONE of 12 traders. Every bet you make affects the group.",\n'
              '        "",\n'
              '    ]'
          )
          NEW2 = (
              '    n_traders = len(TRADERS)\n'
              '    total_start = n_traders * 100.0\n'
              '    lines = [\n'
              '        f"=== COMMON KNOWLEDGE \u2014 Day {day_date} (full transparency) ===",\n'
              '        f"COLLECTIVE GOAL: maximize TOTAL GROUP bankroll \u2192 target ${total_start:,.0f} ($100\xd7{n_traders} start).",\n'
              '        f"You are ONE of {n_traders} traders. Every bet you make affects the group.",\n'
              '        "",\n'
              '    ]'
          )
          OLD3 = (
              '    lines.append(f"GROUP TOTAL: ${total_bankroll:.2f} (started $1,200) | "\n'
              '                 f"ROI {((total_bankroll / 1200.0) - 1) * 100:+.1f}% | "\n'
              '                 f"{total_bets} bets | {total_wins}W")'
          )
          NEW3 = (
              '    lines.append(f"GROUP TOTAL: ${total_bankroll:.2f} (started ${total_start:,.0f}) | "\n'
              '                 f"ROI {((total_bankroll / total_start) - 1) * 100:+.1f}% | "\n'
              '                 f"{total_bets} bets | {total_wins}W")'
          )
          with open(NBA, encoding='utf-8') as fh:
              nba = fh.read()
          assert OLD_CM in nba, 'NBA: COLLECTIVE_MISSION not found'
          assert OLD2 in nba, 'NBA: lines=[] block not found'
          assert OLD3 in nba, 'NBA: GROUP TOTAL block not found'
          nba = nba.replace(OLD_CM, NEW_CM, 1)
          nba = nba.replace(OLD2, NEW2, 1)
          nba = nba.replace(OLD3, NEW3, 1)
          with open(NBA, 'w', encoding='utf-8') as fh:
              fh.write(nba)
          print('NBA patched OK')
          with open(POL, encoding='utf-8') as fh:
              pol = fh.read()
          assert OLD_CM in pol, 'POL: COLLECTIVE_MISSION not found'
          pol = pol.replace(OLD_CM, NEW_CM, 1)
          with open(POL, 'w', encoding='utf-8') as fh:
              fh.write(pol)
          print('Political patched OK')
          PYEOF

      - name: Run patch
        run: python3 /tmp/patch.py

      - name: Verify compile
        run: |
          python3 -m py_compile scripts/arena/hf-llm-trading-floor/app.py && echo "NBA OK"
          python3 -m py_compile scripts/arena/hf-political-trading-floor/app.py && echo "POL OK"

      - name: Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Nomos42 Brain"
          git config user.email "brain@nomos42.ai"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/LBJLincoln/mon-ipad.git"
          git add scripts/arena/hf-llm-trading-floor/app.py scripts/arena/hf-political-trading-floor/app.py
          git diff --cached --stat
          git commit -m "fix(trading-floor): CK block n_traders dynamic (12->17), COLLECTIVE_MISSION 16->17"
          git pull --rebase origin main
          git push

      - name: Self-delete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rm .github/workflows/fix-ck-hardcoded.yml
          git commit -m "ci: remove fix-ck-hardcoded workflow (done)"
          git push
