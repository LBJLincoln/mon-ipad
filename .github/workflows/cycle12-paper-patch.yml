name: Cycle 12 — Apply paper.md patch

on:
  push:
    branches: [main]
    paths:
      - 'papers/axelrod-llm-2026/cycle12-apply-patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply cycle 12 patch to paper.md
        run: python3 papers/axelrod-llm-2026/cycle12-apply-patch.py

      - name: Commit updated paper.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add papers/axelrod-llm-2026/paper.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "paper(axelrod): cycle 12 — apply N12 patch to paper.md (ss4.6 + C.3.3) [automated]"
          git push
