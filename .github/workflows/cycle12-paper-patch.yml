name: Cycle 12 — Apply paper.md patch

on:
  push:
    branches: [main]
    paths:
      - 'papers/axelrod-llm-2026/cycle12-apply-patch.py'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply cycle 12 patch to paper.md
        run: python3 papers/axelrod-llm-2026/cycle12-apply-patch.py

      - name: Commit updated paper.md
        uses: EndBug/add-and-commit@v9
        with:
          add: 'papers/axelrod-llm-2026/paper.md'
          message: 'paper(axelrod): cycle 12 — apply N12 patch to paper.md (§4.6 + C.3.3) [automated]'
          default_author: github_actions
