name: Axelrod fire-6 v2 — society-wide archetype dedup (self-deleting)
on:
  push:
    paths:
      - '.github/workflows/axelrod-fire6-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply _society_archetypes_by_day patch + restore NBA app.py
        run: |
          python3 << 'PYEOF'
import subprocess, sys, os

NBA = 'scripts/arena/hf-llm-trading-floor/app.py'
POL = 'scripts/arena/hf-political-trading-floor/app.py'

def good_content(path):
    with open(path) as f:
        text = f.read()
    if len(text) < 50000 or 'placeholder' in text[:500].lower():
        print(f'  {path}: broken/small, restoring from git history...', file=sys.stderr)
        r = subprocess.run(['git', 'log', '--format=%H', '-n', '30', '--', path],
                           capture_output=True, text=True)
        for sha in r.stdout.strip().split():
            c = subprocess.run(['git', 'show', f'{sha}:{path}'],
                               capture_output=True, text=True)
            if c.returncode == 0 and len(c.stdout) > 80000 and 'placeholder' not in c.stdout[:300].lower():
                print(f'  Restored {path} from {sha} ({len(c.stdout)} chars)', file=sys.stderr)
                return c.stdout
        raise RuntimeError(f'No valid history found for {path}')
    return text

OLD_GLOBAL = '_used_archetypes: Dict[str, set] = defaultdict(set)  # Axelrod Mech B: tid \u2192 set of archetypes tried'
NEW_GLOBAL = ('_used_archetypes: Dict[str, set] = defaultdict(set)  # Axelrod Mech B: per-agent archetype history\n'
              '_society_archetypes_by_day: Dict[str, set] = {}  # Axelrod Mech B: society-wide used archetypes keyed by day')

NBA_OLD_BODY = '''    assignments: Dict[str, str] = {}
    for tid in bottom:
        unused = [a for a in AXELROD_ARCHETYPES if a not in _used_archetypes[tid]]
        if not unused:
            _used_archetypes[tid].clear()  # exhausted \u2192 rotate again
            unused = list(AXELROD_ARCHETYPES)
        # Deterministic pick by tid-hash for reproducibility
        pick = unused[hash(tid + day_date) % len(unused)]
        assignments[tid] = pick
        _used_archetypes[tid].add(pick)
    return assignments'''

POL_OLD_BODY = '''    assignments: Dict[str, str] = {}
    for tid in bottom:
        unused = [a for a in AXELROD_ARCHETYPES if a not in _used_archetypes[tid]]
        if not unused:
            _used_archetypes[tid].clear()
            unused = list(AXELROD_ARCHETYPES)
        pick = unused[hash(tid + day_date) % len(unused)]
        assignments[tid] = pick
        _used_archetypes[tid].add(pick)
    return assignments'''

NEW_BODY = '''    # Society-wide used set: union of all archetypes assigned in the trailing window
    cutoff_keys = sorted(_society_archetypes_by_day.keys())[-trailing_days:]
    society_used: set = set()
    for d in cutoff_keys:
        society_used |= _society_archetypes_by_day.get(d, set())

    assignments: Dict[str, str] = {}
    today_assigned: set = set()
    for tid in bottom:
        # Prefer archetypes unused by ANY agent in the trailing window (Mech B spec)
        unused = [a for a in AXELROD_ARCHETYPES if a not in society_used and a not in today_assigned]
        if not unused:
            # Society-wide pool exhausted \u2014 fall back to per-agent history
            unused = [a for a in AXELROD_ARCHETYPES if a not in _used_archetypes[tid]]
            if not unused:
                _used_archetypes[tid].clear()
                unused = list(AXELROD_ARCHETYPES)
        # Deterministic pick by tid-hash for reproducibility
        pick = unused[hash(tid + day_date) % len(unused)]
        assignments[tid] = pick
        today_assigned.add(pick)
        _used_archetypes[tid].add(pick)

    # Record in society-wide log for future fires
    if assignments:
        _society_archetypes_by_day.setdefault(day_date, set()).update(assignments.values())

    return assignments'''

OLD_CLEAR = '    _used_archetypes.clear()  # Axelrod Mech B: reset archetype history'
NEW_CLEAR = ('    _used_archetypes.clear()  # Axelrod Mech B: reset per-agent archetype history\n'
             '    _society_archetypes_by_day.clear()  # Axelrod Mech B: reset society-wide archetype history')

errors = 0
for path, old_body in [(NBA, NBA_OLD_BODY), (POL, POL_OLD_BODY)]:
    text = good_content(path)

    if '_society_archetypes_by_day' in text:
        print(f'{path}: already patched, skipping')
        continue

    changed = 0
    misses = []
    for old, new, label in [(OLD_GLOBAL, NEW_GLOBAL, 'global'),
                             (old_body, NEW_BODY, 'body'),
                             (OLD_CLEAR, NEW_CLEAR, 'clear')]:
        if old in text:
            text = text.replace(old, new, 1)
            changed += 1
            print(f'  {path}: OK {label}')
        else:
            print(f'  {path}: MISS {label} -- first 80 chars: {repr(old[:80])}', file=sys.stderr)
            misses.append(label)
            errors += 1

    if misses:
        # Dump surrounding context to aid diagnosis
        for old, label in [(OLD_GLOBAL, 'global'), (NBA_OLD_BODY if 'nba' in path else POL_OLD_BODY, 'body'), (OLD_CLEAR, 'clear')]:
            if label in misses:
                key = old[:30]
                idx = text.find(key[:20])
                print(f'  CONTEXT for {label} (idx={idx}): {repr(text[max(0,idx-20):idx+100])}', file=sys.stderr)
        continue  # Don't write broken file

    with open(path, 'w') as f:
        f.write(text)
    count = text.count('_society_archetypes_by_day')
    print(f'{path}: done, {changed} patches, {count} occurrences, {len(text)} chars')

if errors:
    print(f'ABORT: {errors} pattern misses', file=sys.stderr)
    sys.exit(1)
PYEOF

      - name: py_compile both files
        run: |
          python3 -m py_compile scripts/arena/hf-llm-trading-floor/app.py && echo "NBA: PASS"
          python3 -m py_compile scripts/arena/hf-political-trading-floor/app.py && echo "POL: PASS"

      - name: Commit patched files + remove this workflow
        run: |
          git config user.name "Claude Cloud Trigger"
          git config user.email "noreply@anthropic.com"
          git add scripts/arena/hf-llm-trading-floor/app.py
          git add scripts/arena/hf-political-trading-floor/app.py
          git rm --force .github/workflows/axelrod-fire6-patch.yml
          git diff --cached --stat
          git commit -m "fix(tf): Axelrod Mech B society-wide archetype dedup -- both NBA+Political TF apps

_used_archetypes was per-agent. Spec: NEVER USED in prior 7 days by ANYONE.
Added _society_archetypes_by_day global keyed by day_date (trailing-7-day window).
assign_sacrificial_archetypes now builds society_used = union of trailing days,
picks from full AXELROD_ARCHETYPES minus society_used. Falls back to per-agent only
when 20-archetype pool is exhausted. py_compile PASS both apps.
NBA: 5 occurrences, POL: 5 occurrences. Self-deletes workflow on success."
          git pull --rebase origin main
          git push
