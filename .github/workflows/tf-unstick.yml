name: TF Unstick (factory reboot + full clean restart)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-sep: nba,pol,pqtf (default all)'
        required: false
        default: 'nba,pol,pqtf'
      mode:
        description: 'reboot_only | clean_restart | hard_purge (delete Hub state → fresh day 0)'
        required: false
        default: 'hard_purge'

permissions:
  contents: read

jobs:
  unstick:
    name: Unstick TFs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install huggingface_hub
        run: pip install -q huggingface_hub

      - name: Factory reboot + optional clean restart
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_2 }}
          TARGETS: ${{ inputs.targets }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 <<'PY'
          import os, time, json, urllib.request
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ['HF_TOKEN'])
          mode = os.environ.get('MODE', 'clean_restart').strip()
          targets = [t.strip() for t in os.environ.get('TARGETS','nba,pol,pqtf').split(',') if t.strip()]

          repos = {
              'nba':  ('LBJLincoln26/nba-llm-trading-floor',         'https://lbjlincoln26-nba-llm-trading-floor.hf.space'),
              'pol':  ('LBJLincoln26/political-llm-trading-floor',   'https://lbjlincoln26-political-llm-trading-floor.hf.space'),
              'pqtf': ('LBJLincoln26/political-quant-trading-floor', 'https://lbjlincoln26-political-quant-trading-floor.hf.space'),
          }

          STATE_FILES = {
              'nba':  ['data/runtime/state.json','data/runtime/agent_logs.json','data/runtime/council_plans.json'],
              'pol':  ['data/runtime/state.json','data/runtime/agent_logs.json','data/runtime/council_plans.json'],
              'pqtf': [],  # pqtf keeps state only in day-*.json
          }

          def purge_hub_state(t, repo):
              deleted = 0
              for f in STATE_FILES.get(t, []):
                  try:
                      api.delete_file(path_in_repo=f, repo_id=repo, repo_type='space',
                                      commit_message=f'hard-purge: {f}')
                      deleted += 1
                      print(f"[purge-{t}] deleted {f}")
                  except Exception as e:
                      print(f"[purge-{t}] skip {f}: {type(e).__name__}")
              try:
                  files = api.list_repo_files(repo_id=repo, repo_type='space')
                  day_files = [f for f in files if f.startswith('data/decisions/day-') and f.endswith('.json')]
                  for f in day_files:
                      try:
                          api.delete_file(path_in_repo=f, repo_id=repo, repo_type='space',
                                          commit_message=f'hard-purge: {f}')
                          deleted += 1
                      except Exception as e:
                          print(f"[purge-{t}] skip {f}: {type(e).__name__}")
                  print(f"[purge-{t}] total deleted={deleted} day_files_found={len(day_files)}")
              except Exception as e:
                  print(f"[purge-{t}] list_repo_files FAILED: {e}")

          def post(url, body=None, timeout=15):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method='POST',
                  headers={'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read().decode()[:200]
              except Exception as e:
                  return 0, f"{type(e).__name__}: {str(e)[:150]}"

          def get_status(url, timeout=8):
              try:
                  with urllib.request.urlopen(f"{url}/api/status", timeout=timeout) as r:
                      return json.loads(r.read())
              except Exception as e:
                  return {"_err": f"{type(e).__name__}: {str(e)[:100]}"}

          for t in targets:
              if t not in repos:
                  print(f"[unstick] unknown target: {t}"); continue
              repo, url = repos[t]

              # hard_purge: factory_reboot (kill writer) → wait DOWN → purge → wait UP → /api/run
              if mode == 'hard_purge':
                  # Kill old container first so no writer races our delete loop.
                  try:
                      api.restart_space(repo, factory_reboot=True)
                      print(f"[unstick] {t} factory_reboot#1 (kill old) OK")
                  except Exception as e:
                      print(f"[unstick] {t} factory_reboot#1 FAILED: {type(e).__name__}: {e}")
                      continue
                  # Wait for the old container to be torn down (status endpoint 5xx/err).
                  for i in range(12):
                      time.sleep(5)
                      s = get_status(url, timeout=4)
                      if '_err' in s:
                          print(f"[unstick] {t} old container DOWN at t={5*(i+1)}s")
                          break
                  # Purge while no writer is alive. Do it TWICE — HF's build may
                  # start racing us partway through.
                  purge_hub_state(t, repo)
                  time.sleep(4)
                  purge_hub_state(t, repo)
                  # Factory_reboot again to drop any half-built image that may
                  # have downloaded stale state before our purge.
                  try:
                      api.restart_space(repo, factory_reboot=True)
                      print(f"[unstick] {t} factory_reboot#2 (post-purge) OK")
                  except Exception as e:
                      print(f"[unstick] {t} factory_reboot#2 FAILED: {type(e).__name__}: {e}")
                      continue
                  came_up = False
                  for i in range(36):
                      time.sleep(10)
                      s = get_status(url)
                      if '_err' not in s:
                          came_up = True
                          print(f"[unstick] {t} up at t={10*(i+1)}s running={s.get('running')} day={s.get('days_processed')}")
                          break
                  if not came_up:
                      print(f"[unstick] {t} did NOT come back up in 6min"); continue
                  if not s.get('running'):
                      time.sleep(3)
                      code, body = post(f"{url}/api/run", {"resume": False})
                      print(f"[unstick] {t} /api/run → {code} {body[:80]}")
                      time.sleep(8)
                  s = get_status(url)
                  dp = s.get('days_processed') if s.get('days_processed') is not None else s.get('current_day')
                  print(f"[unstick] {t} FINAL: day={dp} running={s.get('running')} resumed={s.get('resumed')}")
                  continue

              try:
                  api.restart_space(repo, factory_reboot=True)
                  print(f"[unstick] {t} factory_reboot OK")
              except Exception as e:
                  print(f"[unstick] {t} factory_reboot FAILED: {type(e).__name__}: {e}")
                  continue
              if mode != 'clean_restart':
                  continue
              came_up = False
              for i in range(30):
                  time.sleep(10)
                  s = get_status(url)
                  if '_err' not in s:
                      came_up = True
                      print(f"[unstick] {t} back up at t={10*(i+1)}s running={s.get('running')}")
                      break
              if not came_up:
                  print(f"[unstick] {t} did NOT come back up within 5min — skipping reset")
                  continue
              # RACE FIX: HF Space auto-resume thread starts running immediately.
              # Must /api/stop first so reset succeeds + memory state doesn't
              # overwrite disk reset on next save.
              time.sleep(3)
              code, body = post(f"{url}/api/stop")
              print(f"[unstick] {t} /api/stop → {code} {body[:80]}")
              # Wait for running=False (auto-resume may race and still be running)
              stopped = False
              for i in range(18):  # up to 3 min
                  time.sleep(10)
                  s = get_status(url)
                  if s.get('running') is False:
                      stopped = True
                      print(f"[unstick] {t} stopped at t={10*(i+1)}s")
                      break
              if not stopped:
                  print(f"[unstick] {t} did NOT stop in 3min — forcing reset anyway")
              time.sleep(2)
              code, body = post(f"{url}/api/reset")
              print(f"[unstick] {t} /api/reset → {code} {body[:80]}")
              time.sleep(2)
              code, body = post(f"{url}/api/run", {"resume": False})
              print(f"[unstick] {t} /api/run resume=false → {code} {body[:80]}")
              time.sleep(6)
              s = get_status(url)
              dp = s.get('days_processed') if s.get('days_processed') is not None else s.get('current_day')
              resumed = s.get('resumed')
              print(f"[unstick] {t} verify: day={dp} running={s.get('running')} resumed={resumed}")
          PY
