# ══════════════════════════════════════════════════════════════
# NOMOS42 FLEET CONFIGURATION
# ══════════════════════════════════════════════════════════════
# 4 machines: 1 cloud VM (primary) + 3 local machines (secondary)
# Rule: ZERO ML training on any local machine. GPU = Kaggle/Modal/Colab/HF.
# Updated: 2026-03-28

fleet:
  primary:
    name: "Google Cloud VM"
    id: "gcp-vm"
    role: "Primary Orchestrator"
    ip: "TBD"  # Fill in with actual external IP
    specs:
      cpu: "1 vCPU"
      ram: "969 MB"
      disk: "30 GB"
      os: "Debian 12 (Linux 6.1)"
      gpu: "none"
    runs:
      - "Cloud Brain (Sonnet 4.6, every 4h at :00)"
      - "Data server (port 8080)"
      - "Terminal API (port 8081)"
      - "Telegram bots (@Nomos42Bot, @RGWAbot)"
      - "12 system cron jobs"
      - "keepalive-spaces.sh (6 islands, every 30min)"
      - "infra-agent.sh (every 30min)"
      - "watchdog.sh (every 5min)"
      - "autonomous-cycle.sh (every 4h at :30)"
    status_check: "curl -s http://localhost:8080/"
    ssh_user: "termius"
    monitor_locally: true

  pierre:
    name: "Pierre — MacBook Air 2016"
    id: "mba-pierre"
    user: "Pierre"
    role: "Prototype User + Browser Dispatch"
    specs:
      cpu: "Intel Core i5 (2 cores)"
      ram: "8 GB"
      disk: "128-256 GB SSD"
      os: "macOS"
      gpu: "Intel HD Graphics 6000 (no CUDA)"
    runs:
      - "Claude Code Desktop + Chrome extension (browser dispatch)"
      - "22-agent swarm access via CLI"
      - "Product testing (dashboard, @Forge42Bot, nomos-picks)"
      - "Git sync (auto-push on session end)"
      - "Background CPU tasks (data analysis, light inference)"
    monitoring_agents:
      - id: 23
        name: "pierre-usage-monitor"
        purpose: "Track CLI quota consumption (daily/weekly)"
      - id: 24
        name: "pierre-practice-monitor"
        purpose: "Analyze usage patterns, suggest optimizations"
      - id: 25
        name: "pierre-infra-monitor"
        purpose: "Track RAM/CPU, determine offloadable compute"
    dispatch:
      enabled: true
      capabilities: ["browser-scraping", "espn", "draftkings", "odds-sites"]
      via: "git task files + Claude Desktop auto-pickup"
    business_model_test:
      purpose: "Validate SaaS pricing ($19/$49/$149)"
      metrics: ["time_to_productive", "agents_used", "daily_return_rate", "would_pay"]
    setup: "docs/PIERRE-INSTALL-MESSAGE.md"
    setup_required: true
    ssh_user: "pierre"

  aurelien:
    name: "Aurelien — Acer Aspire 3"
    id: "acer-aurelien"
    user: "Aurelien (brother)"
    role: "Pure Compute Node (CPU/GPU training)"
    specs:
      cpu: "Intel (dual/quad core)"
      ram: "~8 GB"
      disk: "~256 GB HDD/SSD"
      os: "Windows 11 + WSL2 (Ubuntu)"
      gpu: "Intel HD (CPU-only training)"
    runs:
      - "ML model training (scikit-learn, XGBoost, LightGBM, CatBoost)"
      - "Data fetching (nba_api, odds, injuries)"
      - "Karpathy loop iterations (CPU, overnight)"
      - "Feature engineering compute"
      - "Git sync (auto, every 30min)"
    note: "Aurelien does NOT use Claude Code CLI. Machine runs headlessly via SSH from VM."
    saves: "~$50/month in Kaggle/Colab GPU costs"
    crons:
      - schedule: "0 22-6 * * *"
        script: "scripts/fleet/train-models.sh"
        description: "Overnight model training (extra_trees, XGBoost, LightGBM)"
      - schedule: "0 * * * *"
        script: "scripts/fleet/data-pull.sh"
        description: "Fetch latest odds, injuries, player tracking data"
      - schedule: "*/30 * * * *"
        script: "scripts/fleet/git-sync.sh"
        description: "Pull latest, push local changes"
      - schedule: "0 */4 * * *"
        script: "scripts/fleet/karpathy-cpu.sh"
        description: "CPU Karpathy iterations (tree-based models)"
    setup: "docs/AURELIEN-INSTALL-MESSAGE.md"
    setup_required: true
    ssh_user: "aurelien"

# ── Shared Resources ──────────────────────────────────────────

shared_resources:
  credentials:
    file: ".env.local"
    location: "~/mon-ipad/.env.local on each machine"
    management: "VM is source of truth. scp to distribute."
    gitignored: true
  state_db:
    provider: "Supabase"
    tables:
      - "predictions"
      - "experiments"
      - "fleet_status"
    note: "Primary (ayqviq) paused, using pooler (xivvnr)"
  code_sync:
    method: "GitHub private repos"
    repos:
      - "LBJLincoln/mon-ipad"
      - "LBJLincoln/nomos-nba-agent"
      - "LBJLincoln/nomos-dashboard"
      - "LBJLincoln/nomos-political-alpha"
      - "LBJLincoln/rgwa"
  messaging:
    bot: "@Nomos42Bot"
    channel: "@Nomos42"
    alert_target: "ADMIN_TELEGRAM_ID env var"

# ── GPU Compute (NEVER local) ────────────────────────────────

gpu_platforms:
  kaggle:
    budget: "30hr/week P100 or 2xT4"
    use: "Karpathy loops (NBA + Political)"
    status: "WORKING"
  modal:
    budget: "$30/mo free (Starter)"
    use: "TabICL evolution, serverless GPU"
    status: "ACTIVE"
  colab:
    budget: "Free T4 ~4-12h sessions"
    use: "GPU evolution, TabICL experiments"
    status: "ON-DEMAND"
  hf_spaces:
    budget: "Free CPU (6 NBA + 4 Political islands)"
    use: "24/7 tree-based evolution"
    status: "ALWAYS-ON"

# ── Fleet Communication ──────────────────────────────────────

communication:
  vm_to_machines: "SSH (requires authorized_keys setup)"
  machines_to_vm: "Git push + Supabase writes"
  alerting: "Telegram via @Nomos42Bot"
  status_file: "data/fleet-status.json (written by fleet-agent.sh)"
