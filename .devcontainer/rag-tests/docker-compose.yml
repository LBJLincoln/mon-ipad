# n8n multi-worker stack for rag-tests Codespace
# Queue mode: main + 3 workers for true parallel 1000q evaluation
# Each worker handles 1 pipeline independently
version: '3.8'
services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_tests
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-n8npass}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-nomos-tests-key}
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=4
      - WEBHOOK_URL=http://localhost:5678
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      # Per-pipeline OpenRouter keys
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_KEY_STANDARD=${OPENROUTER_KEY_STANDARD:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_GRAPH=${OPENROUTER_KEY_GRAPH:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_QUANTITATIVE=${OPENROUTER_KEY_QUANTITATIVE:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_ORCHESTRATOR=${OPENROUTER_KEY_ORCHESTRATOR:-${OPENROUTER_API_KEY}}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      # External services
      - JINA_API_KEY=${JINA_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_HOST=${PINECONE_HOST:-https://sota-rag-jina-1024-a4mkzmz.svc.aped-4627-b74a.pinecone.io}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - NEO4J_URI=${NEO4J_URI:-neo4j+s://38c949a2.databases.neo4j.io}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - SUPABASE_HOST=${SUPABASE_HOST:-aws-0-eu-west-1.pooler.supabase.com}
      - SUPABASE_PORT=${SUPABASE_PORT:-6543}
      - SUPABASE_DB=${SUPABASE_DB:-postgres}
      - SUPABASE_USER=${SUPABASE_USER:-postgres.kfyrtsmdolgioyxsglbz}
      - SUPABASE_PASSWORD=${SUPABASE_PASSWORD}
      # LLM Models
      - LLM_MAIN_MODEL=meta-llama/llama-3.3-70b-instruct:free
      - LLM_FAST_MODEL=google/gemma-3-27b-it:free
      - LLM_EXTRACT_MODEL=arcee-ai/trinity-large-preview:free
    volumes:
      - n8n_tests_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  n8n-worker-1:
    image: n8nio/n8n:latest
    command: worker --concurrency=5
    environment:
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_tests
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-n8npass}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-nomos-tests-key}
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=5
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_KEY_STANDARD=${OPENROUTER_KEY_STANDARD:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_GRAPH=${OPENROUTER_KEY_GRAPH:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_QUANTITATIVE=${OPENROUTER_KEY_QUANTITATIVE:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_ORCHESTRATOR=${OPENROUTER_KEY_ORCHESTRATOR:-${OPENROUTER_API_KEY}}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - JINA_API_KEY=${JINA_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_HOST=${PINECONE_HOST:-https://sota-rag-jina-1024-a4mkzmz.svc.aped-4627-b74a.pinecone.io}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - NEO4J_URI=${NEO4J_URI:-neo4j+s://38c949a2.databases.neo4j.io}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - SUPABASE_HOST=${SUPABASE_HOST:-aws-0-eu-west-1.pooler.supabase.com}
      - SUPABASE_PORT=${SUPABASE_PORT:-6543}
      - SUPABASE_DB=${SUPABASE_DB:-postgres}
      - SUPABASE_USER=${SUPABASE_USER:-postgres.kfyrtsmdolgioyxsglbz}
      - SUPABASE_PASSWORD=${SUPABASE_PASSWORD}
      - LLM_MAIN_MODEL=meta-llama/llama-3.3-70b-instruct:free
      - LLM_FAST_MODEL=google/gemma-3-27b-it:free
      - LLM_EXTRACT_MODEL=arcee-ai/trinity-large-preview:free
    volumes:
      - n8n_tests_data:/home/node/.n8n
    depends_on:
      - n8n
    restart: unless-stopped
    mem_limit: 1g

  n8n-worker-2:
    image: n8nio/n8n:latest
    command: worker --concurrency=5
    environment:
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_tests
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-n8npass}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-nomos-tests-key}
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=5
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_KEY_STANDARD=${OPENROUTER_KEY_STANDARD:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_GRAPH=${OPENROUTER_KEY_GRAPH:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_QUANTITATIVE=${OPENROUTER_KEY_QUANTITATIVE:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_ORCHESTRATOR=${OPENROUTER_KEY_ORCHESTRATOR:-${OPENROUTER_API_KEY}}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - JINA_API_KEY=${JINA_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_HOST=${PINECONE_HOST:-https://sota-rag-jina-1024-a4mkzmz.svc.aped-4627-b74a.pinecone.io}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - NEO4J_URI=${NEO4J_URI:-neo4j+s://38c949a2.databases.neo4j.io}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - SUPABASE_HOST=${SUPABASE_HOST:-aws-0-eu-west-1.pooler.supabase.com}
      - SUPABASE_PORT=${SUPABASE_PORT:-6543}
      - SUPABASE_DB=${SUPABASE_DB:-postgres}
      - SUPABASE_USER=${SUPABASE_USER:-postgres.kfyrtsmdolgioyxsglbz}
      - SUPABASE_PASSWORD=${SUPABASE_PASSWORD}
      - LLM_MAIN_MODEL=meta-llama/llama-3.3-70b-instruct:free
      - LLM_FAST_MODEL=google/gemma-3-27b-it:free
      - LLM_EXTRACT_MODEL=arcee-ai/trinity-large-preview:free
    volumes:
      - n8n_tests_data:/home/node/.n8n
    depends_on:
      - n8n
    restart: unless-stopped
    mem_limit: 1g

  n8n-worker-3:
    image: n8nio/n8n:latest
    command: worker --concurrency=5
    environment:
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_tests
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-n8npass}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-nomos-tests-key}
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=5
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_KEY_STANDARD=${OPENROUTER_KEY_STANDARD:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_GRAPH=${OPENROUTER_KEY_GRAPH:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_QUANTITATIVE=${OPENROUTER_KEY_QUANTITATIVE:-${OPENROUTER_API_KEY}}
      - OPENROUTER_KEY_ORCHESTRATOR=${OPENROUTER_KEY_ORCHESTRATOR:-${OPENROUTER_API_KEY}}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - JINA_API_KEY=${JINA_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_HOST=${PINECONE_HOST:-https://sota-rag-jina-1024-a4mkzmz.svc.aped-4627-b74a.pinecone.io}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - NEO4J_URI=${NEO4J_URI:-neo4j+s://38c949a2.databases.neo4j.io}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - SUPABASE_HOST=${SUPABASE_HOST:-aws-0-eu-west-1.pooler.supabase.com}
      - SUPABASE_PORT=${SUPABASE_PORT:-6543}
      - SUPABASE_DB=${SUPABASE_DB:-postgres}
      - SUPABASE_USER=${SUPABASE_USER:-postgres.kfyrtsmdolgioyxsglbz}
      - SUPABASE_PASSWORD=${SUPABASE_PASSWORD}
      - LLM_MAIN_MODEL=meta-llama/llama-3.3-70b-instruct:free
      - LLM_FAST_MODEL=google/gemma-3-27b-it:free
      - LLM_EXTRACT_MODEL=arcee-ai/trinity-large-preview:free
    volumes:
      - n8n_tests_data:/home/node/.n8n
    depends_on:
      - n8n
    restart: unless-stopped
    mem_limit: 1g

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: n8n_tests
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD:-n8npass}
    volumes:
      - postgres_tests_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n_tests"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_tests_data:/data

volumes:
  n8n_tests_data:
  postgres_tests_data:
  redis_tests_data:
